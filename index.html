<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Claude GolfSim — Range</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; overflow: hidden; background: #0a0e12; }
      #app { position: fixed; inset: 0; }
      canvas { display: block; width: 100%; height: 100%; }
      #loading {
        position: fixed; inset: 0; display: grid; place-items: center;
        font: 500 15px/1.4 system-ui, sans-serif; color: #cfe8d4;
        background: radial-gradient(120% 120% at 50% 10%, #17323a 0%, #0a0e12 70%);
        z-index: 50; transition: opacity .6s ease;
      }
      #loading.hidden { opacity: 0; pointer-events: none; }
      #loading .brand { letter-spacing: .18em; text-transform: uppercase; font-size: 12px; opacity: .7; }
      #loading .title { font-size: 22px; margin-top: 8px; font-weight: 700; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="loading">
      <div style="text-align:center">
        <div class="brand">Claude GolfSim</div>
        <div class="title">Warming up the range…</div>
      </div>
    </div>
    <script type="importmap">
      {
        "imports": {
          "three": "/vendor/three.module.js",
          "three/addons/": "/vendor/jsm/"
        }
      }
    </script>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
